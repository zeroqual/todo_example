services:
  db:
    container_name: postgres-dev
    image: postgres:18
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"



volumes:
  postgres_data:
